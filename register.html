<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - مركز الملكة رانيا</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">مر</div>
        <div class="logo-text">
          <h1>مركز الملكة رانيا</h1>
          <p>للدراسات الأردنية وخدمة المجتمع - جامعة اليرموك</p>
        </div>
      </div>
      <nav class="nav-links">
        <a href="index.html">تسجيل الدخول</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="auth-box">
      <div class="card">
        <h3>📝 إنشاء حساب مشترك</h3>
        <p style="color:var(--text-muted); margin-bottom:1.25rem; font-size:0.95rem;">
          أنشئ حساباً لاستعراض الدورات والدبلومات وإرسال استفساراتك إلى إدارة المركز.
        </p>
        <div id="reg-alert"></div>
        <form id="register-form">
          <div class="form-group">
            <label for="full_name">الاسم الكامل *</label>
            <input type="text" id="full_name" name="full_name" required placeholder="الاسم الثلاثي">
          </div>
          <div class="form-group">
            <label for="email">البريد الإلكتروني *</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
          </div>
          <div class="form-group">
            <label for="phone">رقم الهاتف</label>
            <input type="tel" id="phone" name="phone" placeholder="07xxxxxxxx">
          </div>
          <div class="form-group">
            <label for="password">كلمة المرور *</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="6 أحرف على الأقل">
          </div>
          <div class="form-group">
            <label for="password2">تأكيد كلمة المرور *</label>
            <input type="password" id="password2" name="password2" required minlength="6" placeholder="أعد إدخال كلمة المرور">
          </div>
          <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
        </form>
        <div class="auth-footer">
          لديك حساب بالفعل؟ <a href="index.html">سجّل الدخول</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    © مركز الملكة رانيا للدراسات الأردنية وخدمة المجتمع - جامعة اليرموك
  </footer>

  <script src="js/db.js"></script>
  <script>
    (function () {
      const session = DB.getSession();
      if (session) {
        window.location.href = session.role === 'admin' ? 'admin.html' : 'dashboard.html';
      }
    })();

    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const alertBox = document.getElementById('reg-alert');
      alertBox.innerHTML = '';

      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (password !== password2) {
        alertBox.innerHTML = '<div class="alert alert-error">كلمتا المرور غير متطابقتين</div>';
        return;
      }

      const result = DB.register(full_name, email, phone, password);
      if (result.error) {
        alertBox.innerHTML = '<div class="alert alert-error">' + result.error + '</div>';
        return;
      }

      // Auto login
      DB.login(email, password);
      alertBox.innerHTML = '<div class="alert alert-success">تم إنشاء الحساب بنجاح! جاري التحويل...</div>';
      setTimeout(function () {
        window.location.href = 'dashboard.html';
      }, 700);
    });
  </script>
</body>
</html>
